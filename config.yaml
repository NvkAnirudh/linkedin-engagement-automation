# LinkedIn Influencer Tracker Configuration

# Profiles to track (LinkedIn profile URLs or usernames)
profiles:
  - url: "https://www.linkedin.com/in/eczachly/"
    name: "Zach Wilson"
    # Note: Comment style is now automatically matched to the post's detected tone
    # No need to specify a fixed style - the AI will adapt!

# Monitoring settings
monitoring:
  # How often to check for new posts (in minutes)
  check_interval: 30

  # NOTE: The scraper now only fetches the LATEST ORIGINAL POST (excludes reposts)
  # max_posts_per_check and track_recent_days are ignored
  # This ensures we only engage with the influencer's most recent original content
  max_posts_per_check: 1  # Always 1 - latest original post only
  track_recent_days: 0    # Ignored - we just get the latest post

# Comment generation settings
comment_generation:
  # NOTE: Style and length are now AUTOMATICALLY MATCHED to the post's tone
  # The AI analyzes the post and adapts the comment to match:
  #   - Humorous posts get humorous comments
  #   - Technical posts get technical comments
  #   - Inspirational posts get inspirational comments
  # Length is also dynamic (1-3 sentences) based on what fits best

  # These settings are kept for backward compatibility but mostly ignored:
  default_style: "professional"  # Ignored - tone is auto-matched
  length: "short"                # Ignored - length is dynamic

  # Include emojis in comments (AI will use them if tone-appropriate)
  include_emojis: false

  # Tone analysis: MUST be true for tone-matching to work
  analyze_tone: true

# Excel tracking settings
tracking:
  # Path to Excel file
  excel_file: "data/tracked_posts.xlsx"

  # Path to seen posts cache
  cache_file: "data/seen_posts.json"

  # Include post engagement metrics (likes, comments, shares)
  include_metrics: true

# Safety settings
safety:
  # Do not actually post comments (just generate and log them)
  dry_run: true

  # Maximum comments per day per profile
  max_comments_per_day: 10

  # Randomize check times to avoid detection
  randomize_timing: true
